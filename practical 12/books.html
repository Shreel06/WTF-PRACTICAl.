<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Management - Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">📚 City Library</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topMenu" aria-controls="topMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topMenu">
            <div class="ms-auto d-flex align-items-center gap-2 py-2 py-md-0">
                <span class="text-light">Hello, <strong id="welcomeName"></strong></span>
                <span class="badge text-bg-warning" id="roleBadge"></span>
                <button class="btn btn-outline-light btn-sm" id="logoutButton" type="button">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div id="message" class="d-none"></div>

    <div class="card page-card mb-4 d-none" id="adminPanel">
        <div class="card-body">
            <h5 class="card-title">Add a New Book (Admin)</h5>
            <form id="addForm">
                <div class="row g-2">
                    <div class="col-12 col-md-4">
                        <input type="text" class="form-control" id="bookTitle" placeholder="Title" maxlength="100" required>
                    </div>
                    <div class="col-12 col-md-3">
                        <input type="text" class="form-control" id="bookAuthor" placeholder="Author" maxlength="60" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="text" class="form-control" id="bookCategory" placeholder="Category" maxlength="30" required>
                    </div>
                    <div class="col-6 col-md-1">
                        <input type="number" class="form-control" id="bookCopies" placeholder="Qty" min="1" max="100" required>
                    </div>
                    <div class="col-12 col-md-2">
                        <button type="submit" class="btn btn-success w-100">Add Book</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-8">
            <div class="card page-card">
                <div class="card-body">
                    <h5 class="card-title">Books</h5>
                    <form id="searchForm" class="input-group mb-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by title, author or category" maxlength="50">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </form>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Title</th>
                                    <th>Author</th>
                                    <th>Category</th>
                                    <th>Available</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="booksBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <div class="card page-card">
                <div class="card-body">
                    <h5 class="card-title">My Borrowed Books</h5>
                    <ul class="list-group list-group-flush" id="myBooksList"></ul>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-3">
    <small>City Library Management System - Web Technologies Project</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/books.js"></script>
</body>
</html>
