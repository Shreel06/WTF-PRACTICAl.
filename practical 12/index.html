<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Management - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="card auth-card shadow">
        <div class="card-body p-4">
            <h2 class="text-center brand-title mb-1">📚 City Library</h2>
            <p class="text-center text-muted mb-4">Library Management System</p>

            <ul class="nav nav-tabs nav-fill mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab">Login</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab">Register</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                    <div id="loginMessage" class="d-none"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" maxlength="20" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="registerPane" role="tabpanel">
                    <div id="registerMessage" class="d-none"></div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="regUsername" maxlength="20" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword" autocomplete="new-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="regConfirm" class="form-label">Confirm password</label>
                            <input type="password" class="form-control" id="regConfirm" autocomplete="new-password" required>
                        </div>
                        <ul class="rules">
                            <li>Username: 4 to 20 letters, numbers or underscore</li>
                            <li>Password: 8 to 64 characters</li>
                            <li>One uppercase, one lowercase, one digit, one special character</li>
                        </ul>
                        <button type="submit" class="btn btn-success w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
